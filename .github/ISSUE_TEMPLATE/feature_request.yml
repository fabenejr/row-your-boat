name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to change or add?
      description: Describe the idea and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: How should it work in game?
      description: Controls, visuals, multiplayer behavior, config options...
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself
